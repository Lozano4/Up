name: report

on:
  schedule:
    # 13:00 UTC weekdays = 6:00 AM Pacific (PDT) / 5:00 AM (PST), after the previous day's filings.
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests
        run: pytest -q

      - name: Fetch and report
        run: python -m cluster run-all

      - name: Commit data and reports
        run: |
          git config user.name "insider-cluster bot"
          git config user.email "insider-cluster-bot@users.noreply.github.com"
          git add data/ reports/
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "report $(TZ=America/Los_Angeles date +%F)"
          git push origin HEAD:main

      - name: Run notes
        run: cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
